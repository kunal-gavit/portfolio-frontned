<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Circuit Pattern Grid -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Avatar Silhouette / Initial Icon -->
  <g transform="translate(100, 100)">
    <circle cx="100" cy="70" r="45" fill="url(#primaryGlow)" opacity="0.85" filter="url(#glow)"/>
    <path d="M 30 180 C 30 120, 170 120, 170 180 Z" fill="url(#primaryGlow)" opacity="0.75" filter="url(#glow)"/>
  </g>
  
  <!-- Tech Monogram -->
  <text x="200" y="340" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f4f4f5" text-anchor="middle" letter-spacing="2">KUNAL GAVIT</text>
  <text x="200" y="365" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#06b6d4" text-anchor="middle" letter-spacing="1">ENGINEER • DEVELOPER</text>
</svg>
